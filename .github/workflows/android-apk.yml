name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Civilization Genesis 3D APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android-ready project
        run: |
          test -f "Civilization-Genesis-3D-Android-ready-ROOT.zip"
          mkdir -p project
          unzip -q "Civilization-Genesis-3D-Android-ready-ROOT.zip" -d project
          test -f project/package.json
          test -f project/capacitor.config.ts

      - name: Install dependencies
        working-directory: project
        run: npm ci

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Civilization-Genesis-3D-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
